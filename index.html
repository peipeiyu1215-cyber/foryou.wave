function cleanComparisonStroke(image) {
  const canvas=document.createElement('canvas');canvas.width=image.width;canvas.height=image.height;
  const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0);const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);
  const {data,width:w,height:h}=pixels,seen=new Uint8Array(w*h);

    const component=[seed];seen[seed]=1;
    for(let k=0;k<component.length;k++){

$('fullscreen').onclick=async()=>{document.body.classList.add('immersive');try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch{}resize()};$('restore').onclick=async()=>{document.body.classList.remove('immersive');if(document.fullscreenElement)await document.exitFullscreen();resize()};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('immersive');resize()});
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')setAngle(angle+1,true);if(e.key==='ArrowLeft')setAngle(angle-1,true);if(e.key==='Escape')$('restore').click()});
function frame(now){const dt=lastFrame?Math.min(now-lastFrame,60):0;lastFrame=now;if(!document.hidden){clock+=dt/1000;if(playing)advancePreview(dt);if(ready)sea.step(angle,dt/1000);render()}requestAnimationFrame(frame)}

if(screen.orientation)screen.orientation.addEventListener('change',syncScreenFrame);else window.addEventListener('orientationchange',syncScreenFrame);

window.containerReady=Promise.all(Array.from({length:11},(_,i)=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(cleanComparisonStroke(img));img.onerror=()=>reject(Error('無法載入原筆跡'));img.src=comparisonHandwriting[i];}))).then(glyphs=>{sea=new ContainerWater(glyphs);ready=true;resize();setAngle(0);render(0);requestAnimationFrame(frame);}).catch(e=>{$('status').textContent=e.message;throw e;});
window.containerDebug={
setAngle:a=>setAngle(a,true),step:dt=>sea.step(angle,dt),render,
settle(a=angle){setAngle(a,true);sea.settle(a);render(0);},
get angle(){return angle},get playing(){return playing},get sensing(){return sensing},get sea(){return sea},
orientation,advancePreview,diagnostics:()=>sea.diagnostics(),
visible(){sea.updateLine();sea.prepareText();return sea.layers.map(({body,reflection})=>{const count=c=>{const pixels=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let area=0;for(let i=3;i<pixels.length;i+=4)area+=pixels[i]/255;return area;};return {body:count(body),reflection:count(reflection)};});},
sensorView(on){sensing=on;render(0);}
};
</script></body></html>
